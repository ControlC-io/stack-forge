name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # `build` runs tsc first, so this also typechecks. Same BASE_PATH as the
      # deploy, so the PR builds exactly what Pages would publish.
      - run: npm run build
        env:
          BASE_PATH: /stack-forge/
